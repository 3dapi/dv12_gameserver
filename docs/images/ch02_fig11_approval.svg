<text x="450" y="523" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#C5221F">거절 사유: NetworkManager.DisconnectReason</text>
<text x="450" y="575" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">승인 대기 시간 제한: Client Connection Buffer Timeout (기본 10초)</text>
<text x="500.0" y="645" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">payload는 암호화되지 않는다. 비밀번호 같은 값은 그대로 보내지 않는다 (6장의 HELLO 인증과 같은 구조).</text>
