<text x="445" y="473" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">→ OnClientConnectedCallback</text>
<rect x="620" y="410" width="300" height="84" rx="8" fill="#FCE8E6" stroke="#C5221F" stroke-width="2" opacity="1"/>
<text x="770" y="434" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#C5221F">거절 (Approved = false)</text>
<text x="770" y="456" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">연결이 끊어진다</text>
<text x="770" y="473" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">→ OnClientDisconnectCallback</text>
