<text x="200" y="168" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">NetworkConfig.ConnectionData = bytes</text>
<line x1="206" y1="215" x2="734" y2="215" stroke="#137333" stroke-width="2.4" marker-end="url(#m1)"/>
<text x="470" y="203" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#137333">② StartClient()  연결 요청 + payload</text>
<rect x="530" y="255" width="420" height="112" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="740" y="279" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1A56C4">③ ConnectionApprovalCallback(request, response)</text>
<text x="740" y="303" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">request.Payload 읽기 → 이름·코드·정원 검사</text>
<text x="740" y="320" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">response.Approved = true / false</text>
<text x="740" y="337" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">response.Reason = "거절 사유"</text>
<text x="740" y="354" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#202124">response.CreatePlayerObject = true</text>
<rect x="300" y="410" width="290" height="84" rx="8" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="445" y="434" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#137333">승인 (Approved = true)</text>
