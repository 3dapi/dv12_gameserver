<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137333"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A56C4"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A56C4"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137333"/></marker></defs>
<text x="500.0" y="30" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#202124">그림 2-8  클라이언트가 접속할 때 일어나는 일</text>
<rect x="115.0" y="55" width="170" height="40" rx="8" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="200" y="81.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#137333">클라이언트</text>
<line x1="200" y1="95" x2="200" y2="665" stroke="#137333" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="665.0" y="55" width="170" height="40" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="750" y="81.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1A56C4">서버</text>
<line x1="750" y1="95" x2="750" y2="665" stroke="#1A56C4" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="206" y1="130" x2="744" y2="130" stroke="#137333" stroke-width="2.4" marker-end="url(#m1)"/>
<text x="500" y="118" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#137333">① 연결 요청  (+ ConnectionData)</text>
<rect x="550" y="168" width="400" height="38" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="750" y="193" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1A56C4">② 접속 승인 콜백  (Connection Approval 사용 시)</text>
<rect x="550" y="228" width="400" height="56" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="750" y="252" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1A56C4">③ 승인되면 플레이어 오브젝트를 만들고 Spawn</text>
<text x="750" y="273" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A56C4">→ 서버에서 OnNetworkSpawn()</text>
<text x="320" y="252" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">다른 접속자에게는</text>
<text x="320" y="272" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">새 플레이어 생성이 알려진다</text>
<line x1="545" y1="256" x2="440" y2="256" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#m2)"/>
<line x1="744" y1="335" x2="206" y2="335" stroke="#1A56C4" stroke-width="2.4" marker-end="url(#m3)"/>
<text x="500" y="323" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A56C4">④ 승인 응답  (거절이면 사유와 함께 연결 종료)</text>
<line x1="744" y1="405" x2="206" y2="405" stroke="#1A56C4" stroke-width="2.4" marker-end="url(#m4)"/>
<text x="500" y="393" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A56C4">⑤ 씬 동기화: 씬 로드 + 이미 있는 NetworkObject 전달</text>
<rect x="115" y="428" width="360" height="56" rx="8" fill="#FEF3D7" stroke="#B45F06" stroke-width="2" opacity="1"/>
<text x="295" y="452" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#B45F06">내 플레이어를 포함한 오브젝트 생성</text>
<text x="295" y="473" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#B45F06">→ 클라이언트에서 OnNetworkSpawn()</text>
<line x1="206" y1="548" x2="744" y2="548" stroke="#137333" stroke-width="2.4" marker-end="url(#m5)"/>
<text x="500" y="536" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#137333">⑥ 동기화 완료 통지</text>
<rect x="115" y="580" width="340" height="60" rx="8" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="285" y="604" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#137333">OnClientConnectedCallback</text>
<text x="285" y="625" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">(클라이언트 자신의 연결 완료)</text>
<rect x="495" y="580" width="340" height="60" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="665" y="604" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1A56C4">OnClientConnectedCallback</text>
<text x="665" y="625" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">(서버에서 이 클라이언트의 연결 완료)</text>
<text x="500.0" y="683" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">승인을 쓰지 않으면 ②는 생략되고, 씬 관리(Enable Scene Management)를 끄면 ⑤의 씬 로드가 없다. (개념도, NGO 2.x 기준)</text>
</svg>