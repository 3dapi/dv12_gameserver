<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137333"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137333"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A56C4"/></marker></defs>
<text x="500.0" y="30" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#202124">그림 2-16  클라이언트 예측과 서버 보정</text>
<rect x="115.0" y="56" width="220" height="40" rx="8" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="225" y="82.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#137333">클라이언트 (나)</text>
<line x1="225" y1="96" x2="225" y2="545" stroke="#137333" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="665.0" y="56" width="220" height="40" rx="8" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="775" y="82.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1A56C4">서버</text>
<line x1="775" y1="96" x2="775" y2="545" stroke="#1A56C4" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="60" y="108" width="330" height="86" rx="12" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="225.0" y="132" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#137333">① 입력 #57을 받는다</text>
<text x="225.0" y="156.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">바로 내 화면에 적용한다 (예측)</text>
<text x="225.0" y="174.85" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">보낸 입력 목록: #57</text>
<rect x="60" y="226" width="330" height="86" rx="12" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="225.0" y="250" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#137333">③ 입력 #58, #59를 받는다</text>
<text x="225.0" y="274.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">서버의 답을 기다리지 않고 바로 적용한다</text>
<text x="225.0" y="292.85" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">보낸 입력 목록: #57, #58, #59</text>
<rect x="610" y="236" width="330" height="112" rx="12" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="775.0" y="260" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A56C4">② 입력 #57을 처리하고 답한다</text>
<text x="775.0" y="284.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">서버의 진짜 상태가 바뀐다</text>
<text x="775.0" y="302.85" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">보내는 내용: 상태(위치) +</text>
<text x="775.0" y="321.7" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">마지막으로 처리한 입력 번호 #57</text>
<rect x="60" y="410" width="330" height="116" rx="12" fill="#FEF3D7" stroke="#B45F06" stroke-width="2" opacity="1"/>
<text x="225.0" y="434" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#B45F06">④ 서버의 답이 도착한다</text>
<text x="225.0" y="458.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">입력 목록에서 #57을 지운다 → 남은 입력: #58, #59</text>
<text x="225.0" y="476.85" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">서버가 보낸 상태에서 시작해</text>
<text x="225.0" y="495.7" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">#58, #59를 다시 적용한다</text>
<line x1="390" y1="150" x2="610" y2="262" stroke="#137333" stroke-width="3" marker-end="url(#m1)"/>
<rect x="463.61" y="177.0" width="72.78" height="26" rx="13.0" fill="#E6F4EA" stroke="#137333" stroke-width="1.5"/>
<text x="500" y="194.55" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#137333">입력 #57</text>
<line x1="390" y1="285" x2="610" y2="300" stroke="#137333" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#m2)"/>
<rect x="425.44" y="263.0" width="149.12" height="26" rx="13.0" fill="#E6F4EA" stroke="#137333" stroke-width="1.5"/>
<text x="500" y="280.2" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#137333">#58, #59도 계속 보낸다</text>
<line x1="610" y1="335" x2="390" y2="452" stroke="#1A56C4" stroke-width="3" marker-end="url(#m3)"/>
<rect x="412.48" y="355.0" width="175.04000000000002" height="26" rx="13.0" fill="#E8F0FE" stroke="#1A56C4" stroke-width="1.5"/>
<text x="500" y="372.2" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1A56C4">상태 + 마지막 처리 번호 #57</text>
<rect x="620" y="360" width="310" height="22" fill="#FFFFFF"/>
<text x="775" y="376" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">(#58, #59에 대한 답도 같은 방식으로 온다)</text>
<line x1="36" y1="150" x2="36" y2="470" stroke="#5F6368" stroke-width="2"/>
<line x1="30" y1="150" x2="42" y2="150" stroke="#5F6368" stroke-width="2"/>
<line x1="30" y1="470" x2="42" y2="470" stroke="#5F6368" stroke-width="2"/>
<text transform="rotate(-90 18 310)" x="18" y="310" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">서버의 답이 오기까지(RTT)에도 화면은 계속 반응한다</text>
<rect x="60" y="560" width="880" height="90" rx="12" fill="#F1F3F4" stroke="#5F6368" stroke-width="2" opacity="1"/>
<text x="500.0" y="584" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#202124">⑤ 결과</text>
<text x="500.0" y="608.0" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">예측이 맞았으면 화면에 변화가 없다. 틀렸으면 이때 위치가 서버의 값에 맞게 바뀐다(보정).</text>
<text x="500.0" y="626.85" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#202124">이 방식은 서버와 클라이언트가 같은 입력에 같은 결과를 내야 하므로, 이동 계산을 공통 함수로 만들어 양쪽이 같이 쓴다.</text>
</svg>