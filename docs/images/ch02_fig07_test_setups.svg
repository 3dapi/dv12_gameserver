<text x="500.0" y="525" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">어느 방법이든 서버 하나에 클라이언트가 접속하는 구조는 같다. 처음에는 A로 빠르게 시험하고, 배포 전에는 B·C로 확인한다.</text>
