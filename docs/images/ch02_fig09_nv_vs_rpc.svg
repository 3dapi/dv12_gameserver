<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A56C4"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A56C4"/></marker></defs>
<text x="500.0" y="30" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#202124">그림 2-9  NetworkVariable과 RPC: 늦게 접속한 클라이언트</text>
<line x1="60" y1="110" x2="940" y2="110" stroke="#5F6368" stroke-width="2" marker-end="url(#m1)"/>
<text x="940" y="98" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="end" fill="#5F6368">시간</text>
<line x1="200" y1="100" x2="200" y2="120" stroke="#5F6368" stroke-width="2"/>
<text x="200" y="140" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#202124">t1</text>
<line x1="480" y1="100" x2="480" y2="120" stroke="#5F6368" stroke-width="2"/>
<text x="480" y="140" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#202124">t2</text>
<line x1="760" y1="100" x2="760" y2="120" stroke="#5F6368" stroke-width="2"/>
<text x="760" y="140" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#202124">t3</text>
<text x="200" y="160" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">서버가 값을 바꾸고</text>
<text x="200" y="178" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">사건을 알린다</text>
<text x="480" y="160" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">클라이언트 B가</text>
<text x="480" y="178" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">뒤늦게 접속한다</text>
<text x="760" y="160" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">B가 받은 것을</text>
<text x="760" y="178" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">확인한다</text>
<rect x="40" y="205" width="920" height="150" rx="12" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="60" y="232" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1A56C4">NetworkVariable&lt;int&gt; Hp</text>
<rect x="150" y="250" width="100" height="44" rx="12" fill="#E8F0FE" stroke="#1A56C4" stroke-width="2" opacity="1"/>
<text x="200.0" y="278" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A56C4">Hp = 80</text>
<text x="200" y="322" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">값이 서버에 저장된다</text>
<rect x="430" y="250" width="100" height="44" rx="12" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="480.0" y="278" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#137333">B 접속</text>
<line x1="250" y1="272" x2="430" y2="272" stroke="#1A56C4" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#m2)"/>
<rect x="700" y="250" width="120" height="44" rx="12" fill="#FEF3D7" stroke="#B45F06" stroke-width="2" opacity="1"/>
<text x="760.0" y="278" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#B45F06">B: Hp = 80  ✔</text>
<line x1="530" y1="272" x2="700" y2="272" stroke="#1A56C4" stroke-width="2.4" marker-end="url(#m3)"/>
<text x="615" y="262" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A56C4">접속 때 현재 값 전송</text>
<text x="840" y="330" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#137333">늦게 와도 현재 상태를 안다</text>
<rect x="40" y="375" width="920" height="150" rx="12" fill="#FCE8E6" stroke="#C5221F" stroke-width="2" opacity="1"/>
<text x="60" y="402" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#C5221F">RPC  HitRpc()</text>
<rect x="150" y="420" width="100" height="44" rx="12" fill="#FCE8E6" stroke="#C5221F" stroke-width="2" opacity="1"/>
<text x="200.0" y="448" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#C5221F">HitRpc 호출</text>
<text x="200" y="492" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F6368">그 순간 접속한 쪽에만 전달</text>
<rect x="430" y="420" width="100" height="44" rx="12" fill="#E6F4EA" stroke="#137333" stroke-width="2" opacity="1"/>
<text x="480.0" y="448" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#137333">B 접속</text>
<rect x="700" y="420" width="120" height="44" rx="12" fill="#FCE8E6" stroke="#C5221F" stroke-width="2" opacity="1"/>
<text x="760.0" y="448" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#C5221F">B: 못 받음  ✘</text>
<text x="840" y="500" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#C5221F">지나간 사건은 다시 오지 않는다</text>
<text x="500.0" y="548" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5F6368">계속 유지돼야 하는 값(체력, 이름, 접속자 목록)은 NetworkVariable, 한 번 일어나고 끝나는 사건(채팅 한 줄, 효과음)은 RPC를 쓴다.</text>
</svg>